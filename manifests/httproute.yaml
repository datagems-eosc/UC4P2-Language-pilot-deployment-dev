apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dg-uc4p2-language-pilot-httproute
  namespace: zhaw
spec:
  parentRefs:
    - name: datagems
      namespace: datagems-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /language-pilot
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: dg-uc4p2-language-pilot
          port: 8080
      timeouts:
        request: 3600s
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: dg-uc4p2-language-pilot-traffic
  namespace: zhaw
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dg-uc4p2-language-pilot-httproute
  timeout:
    http:
      streamIdleTimeout: 3600s
